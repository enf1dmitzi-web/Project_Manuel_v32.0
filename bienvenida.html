<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Manuel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #matrix {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        #loading {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #0f0;
            font-size: 1.1em;
            text-shadow: 0 0 10px #0f0;
            padding: 20px;
            text-align: left;
        }
        .content img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #0f0;
            box-shadow: 0 0 25px #0f0;
            animation: float 3s ease-in-out infinite;
            margin-bottom: 30px;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .title {
            color: #0f0;
            font-size: 1.4em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #0f0;
        }
        .subtitle {
            color: #6f6;
            font-size: 0.9em;
            margin-bottom: 40px;
            opacity: 0.8;
        }
        .buttons {
            display: flex;
            gap: 20px;
            position: relative;
        }
        #btnSi {
            background: transparent;
            border: 2px solid #0f0;
            color: #0f0;
            padding: 14px 32px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0,255,0,0.4);
            transition: all 0.3s;
        }
        #btnSi:hover, #btnSi:active {
            background: #0f0;
            color: #000;
        }
        #btnNo {
            background: transparent;
            border: 2px solid #f33;
            color: #f33;
            padding: 14px 32px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            cursor: pointer;
            border-radius: 6px;
            position: absolute;
            transition: transform 0.15s ease-out;
        }
    </style>
</head>
<body>

<audio id="typeSound" src="audio/tecleo.mp3" loop></audio>

<canvas id="matrix"></canvas>

<div id="loading">
    <div id="loadingText"></div>
</div>

<div class="content" id="mainContent">
    <img src="images/principito.jpg" alt="Principito">
    <div class="title">Project_Manuel_v32.0</div>
    <div class="subtitle" id="subtitleText"></div>
    <div class="title" style="font-size:1.1em; margin-bottom:20px;" id="questionText"></div>
    <div class="buttons">
        <button id="btnSi" onclick="window.location.href='index.html'">Sí</button>
        <button id="btnNo">No</button>
    </div>
</div>

<script>
const btnNo = document.getElementById('btnNo');
function escapar() {
    const maxX = window.innerWidth - 120;
    const maxY = window.innerHeight - 60;
    const x = Math.random() * maxX - maxX / 2;
    const y = Math.random() * maxY - maxY / 2;
    btnNo.style.transform = `translate(${x}px, ${y}px)`;
}
btnNo.addEventListener('mouseenter', escapar);
btnNo.addEventListener('touchstart', function(e) {
    e.preventDefault();
    escapar();
});
</script>

<script>
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01アイウエオカキクケコサシスセソタチツテト";
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function draw() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#0f0";
    ctx.font = fontSize + "px monospace";
    for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}

setInterval(draw, 40);

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

function typeWriter(element, text, speed, callback) {
    let i = 0;
    function type() {
        if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(type, speed);
        } else if (callback) {
            callback();
        }
    }
    type();
}

const loadingText = document.getElementById('loadingText');
const loadingLines = [
    "Initializing Project...",
    "Loading repository...",
    "Checking commit history...",
    "",
    "✔ Repository found. 32 commits detected."
];

function runLoadingSequence(index) {
    if (index === 0) {
        const sound = document.getElementById('typeSound');
        sound.play().catch(() => {});
    }
    if (index >= loadingLines.length) {
        document.getElementById('typeSound').pause();
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('mainContent').style.display = 'flex';
            const subtitleEl = document.getElementById('subtitleText');
            typeWriter(subtitleEl, "Repository found. 32 commits detected.", 30, () => {
                const questionEl = document.getElementById('questionText');
                typeWriter(questionEl, "¿Estás listo para ver esto?", 40);
            });
        }, 800);
        return;
    }
    const line = document.createElement('div');
    loadingText.appendChild(line);
    typeWriter(line, loadingLines[index], 35, () => {
        setTimeout(() => runLoadingSequence(index + 1), 400);
    });
}

runLoadingSequence(0);
</script>

</body>
</html>
